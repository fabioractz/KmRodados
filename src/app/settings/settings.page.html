<ion-header mode="ios" class="settings-header">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/tabs/more" text="Mais"></ion-back-button></ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="settings-content">
  <main class="settings-layout">
    <header><p class="eyebrow">KM RODADOS</p><h1>Configurações</h1><p class="description">Seu app, do seu jeito.</p></header>

    <section aria-labelledby="appearance-heading">
      <h2 id="appearance-heading"><ion-icon name="color-palette-outline" aria-hidden="true"></ion-icon>Aparência</h2>
      <div class="settings-group">
        <div class="theme-options" role="group" aria-label="Tema do app">
          <button type="button" [attr.aria-pressed]="themeMode === 'system'" (click)="selecionarTema('system', $event)">Sistema</button>
          <button type="button" [attr.aria-pressed]="themeMode === 'light'" (click)="selecionarTema('light', $event)">Claro</button>
          <button type="button" [attr.aria-pressed]="themeMode === 'dark'" (click)="selecionarTema('dark', $event)">Escuro</button>
        </div>
        <button type="button" class="settings-row color-trigger" (click)="toggleColorPicker()" [attr.aria-expanded]="showColorPicker" aria-controls="theme-colors">
          <span>Cor do tema</span><span class="color-value"><span class="color-swatch" [style.background]="selectedColor" aria-hidden="true"></span>{{ getSelectedColorName() }}<ion-icon [name]="showColorPicker ? 'chevron-up-outline' : 'chevron-down-outline'" aria-hidden="true"></ion-icon></span>
        </button>
        <div class="color-options" id="theme-colors" *ngIf="showColorPicker">
          <button type="button" class="color-choice" *ngFor="let color of colors" (click)="changeColor(color.value)" [attr.aria-label]="color.name" [attr.aria-pressed]="selectedColor === color.value">
            <span class="color-circle" [style.background]="color.value"><ion-icon name="checkmark-outline" *ngIf="selectedColor === color.value" [style.color]="color.contrast" aria-hidden="true"></ion-icon></span>
          </button>
        </div>
      </div>
    </section>

    <section aria-labelledby="home-heading">
      <h2 id="home-heading"><ion-icon name="settings-outline" aria-hidden="true"></ion-icon>Tela inicial</h2>
      <div class="settings-group">
        <ion-reorder-group (ionItemReorder)="onReorder($event)" [disabled]="false">
          <ion-item class="layout-item" lines="none" *ngFor="let key of homeCardsOrder; let i = index">
            <ion-label>{{ homeCardsLabels[key] }}</ion-label>
            <div class="order-buttons" slot="end">
              <button type="button" [disabled]="i === 0" [attr.aria-label]="'Mover ' + homeCardsLabels[key] + ' para cima'" (click)="moveCard(i, -1)">↑</button>
              <button type="button" [disabled]="i === homeCardsOrder.length - 1" [attr.aria-label]="'Mover ' + homeCardsLabels[key] + ' para baixo'" (click)="moveCard(i, 1)">↓</button>
            </div>
            <ion-toggle slot="end" [attr.aria-label]="'Mostrar ' + homeCardsLabels[key]" [checked]="homeCardsEnabled[key]" (ionChange)="toggleCardEnabled(key, $event)"></ion-toggle>
            <ion-reorder slot="end" [attr.aria-label]="'Reordenar ' + homeCardsLabels[key]"></ion-reorder>
          </ion-item>
        </ion-reorder-group>
        <p class="section-note">Escolha o que aparece. Arraste os itens ou use as setas para ajustar a ordem.</p>
      </div>
    </section>

    <section aria-labelledby="data-heading">
      <h2 id="data-heading"><ion-icon name="cloud-download-outline" aria-hidden="true"></ion-icon>Seus dados</h2>
      <div class="settings-group">
        <button type="button" class="settings-row" (click)="downloadBackup()"><span>Exportar backup</span><ion-icon name="cloud-download-outline" aria-hidden="true"></ion-icon></button>
        <button type="button" class="settings-row" (click)="triggerImport()"><span>Importar backup</span><ion-icon name="cloud-upload-outline" aria-hidden="true"></ion-icon></button>
        <input type="file" #fileInput (change)="onFileSelected($event)" hidden accept=".json">
      </div>
    </section>

    <section aria-labelledby="about-heading">
      <h2 id="about-heading"><ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>Sobre o app</h2>
      <div class="settings-group">
        <div class="settings-row"><span>Versão do app</span><span class="version">{{ versao_app || '0.0.0' }}</span></div>
        <ion-item class="terms-row" button lines="none" detail="true"><ion-label>Termos de uso</ion-label></ion-item>
      </div>
    </section>

    <section aria-labelledby="manage-heading">
      <h2 id="manage-heading">Gerenciar dados</h2>
      <div class="settings-group"><button type="button" class="settings-row danger-row" (click)="confirmClearData()"><span>Apagar todos os dados</span><ion-icon name="trash-outline" aria-hidden="true"></ion-icon></button></div>
    </section>
  </main>
</ion-content>
