<ion-content class="vehicles-content">
  <main class="vehicles-layout">
    <header class="vehicles-heading">
      <div>
        <p class="eyebrow">KM RODADOS</p>
        <h1>Meus veículos</h1>
        <p class="vehicle-count">{{ vehicles.length }} {{ vehicles.length === 1 ? 'veículo cadastrado' : 'veículos cadastrados' }}</p>
      </div>
      <button type="button" class="add-vehicle" aria-label="Adicionar veículo" (click)="toggleForm()">
        <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <section class="vehicle-grid" aria-label="Veículos cadastrados" *ngIf="vehicles.length; else emptyVehicles">
      <article class="vehicle-card" *ngFor="let vehicle of vehicles">
        <button type="button" class="vehicle-open" (click)="abrirPaginaAcoesVeiculo(vehicle)" [attr.aria-label]="'Ver veículo ' + vehicle.model + ', placa ' + vehicle.plate">
          <div class="vehicle-identity">
            <span class="vehicle-symbol"><ion-icon [name]="getVehicleIcon(vehicle.type)" aria-hidden="true"></ion-icon></span>
            <div class="vehicle-name"><h2>{{ vehicle.model }}</h2><span class="vehicle-plate">{{ vehicle.plate | uppercase }}</span></div>
          </div>
          <div class="vehicle-status"><span class="default-badge" *ngIf="vehicle.isDefault"><ion-icon name="star" aria-hidden="true"></ion-icon>Principal</span></div>
          <div class="vehicle-odometer"><span>Odômetro atual</span><strong>{{ getCurrentOdometer(vehicle) | number:'1.0-0' }} <small>km</small></strong></div>
          <div class="vehicle-details-link"><span>Ver veículo</span><ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon></div>
        </button>
        <button type="button" class="vehicle-menu" [attr.aria-label]="'Ações de ' + vehicle.model" (click)="openVehicleMenu(vehicle)">
          <ion-icon name="ellipsis-horizontal" aria-hidden="true"></ion-icon>
        </button>
      </article>
    </section>

    <ng-template #emptyVehicles>
      <section class="empty-vehicles">
        <span class="vehicle-symbol"><ion-icon name="car-outline" aria-hidden="true"></ion-icon></span>
        <h2>Sua garagem começa aqui</h2>
        <p>Cadastre um veículo para acompanhar abastecimentos, consumo e manutenções.</p>
        <ion-button (click)="toggleForm()">Adicionar veículo</ion-button>
      </section>
    </ng-template>
  </main>
</ion-content>
