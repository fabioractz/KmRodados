<ion-content class="more-content">
  <main class="more-layout">
    <header><p class="eyebrow">KM RODADOS</p><h1>Mais</h1><p class="description">Finanças e preferências do seu app.</p></header>
    <section aria-labelledby="finance-heading">
      <h2 id="finance-heading">Finanças do veículo</h2>
      <div class="menu-group">
        <button type="button" class="menu-row" (click)="abrirDespesas()">
          <span class="menu-icon"><ion-icon name="card-outline" aria-hidden="true"></ion-icon></span>
          <span class="menu-copy"><strong>Despesas</strong><small>Organize seus gastos</small></span>
          <ion-icon class="menu-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
        <button type="button" class="menu-row" (click)="abrirReceitas()">
          <span class="menu-icon"><ion-icon name="cash-outline" aria-hidden="true"></ion-icon></span>
          <span class="menu-copy"><strong>Receitas</strong><small>Acompanhe os recebimentos</small></span>
          <ion-icon class="menu-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </section>
    <section aria-labelledby="preferences-heading">
      <h2 id="preferences-heading">Preferências</h2>
      <div class="menu-group">
        <button type="button" class="menu-row" (click)="abrirConfiguracoes()">
          <span class="menu-icon"><ion-icon name="settings-outline" aria-hidden="true"></ion-icon></span>
          <span class="menu-copy"><strong>Configurações</strong><small>Personalize seu app</small></span>
          <ion-icon class="menu-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </section>
  </main>
</ion-content>
